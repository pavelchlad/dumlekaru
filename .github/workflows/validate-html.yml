name: Validate HTML

on:
  pull_request:
    branches:
      - gh-pages
  push:
    branches:
      - gh-pages

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate HTML
        run: npm run validate:html
